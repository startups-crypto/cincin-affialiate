# Скопируйте этот файл в config.toml и заполните значения.
# config.toml содержит секреты и исключён из Git. Не публикуйте заполненный файл.

[telegram]
# Токен вашего Telegram-бота от @BotFather.
token = ""
# Числовой Telegram ID владельца. Несколько владельцев: [123456789, 987654321].
# Свой ID можно узнать командой /id в боте. Менеджеров назначает владелец через панель.
owner_ids = []

[youtube]
# Ключ Google Cloud проекта с включённым YouTube Data API v3.
api_key = ""

[google_sheets]
# ID существующей таблицы: часть URL между /d/ и /edit.
# Дайте сервисному аккаунту права «Редактор» на эту таблицу.
spreadsheet_id = ""

[google_sheets.service_account]
# Скопируйте значения из JSON-ключа сервисного аккаунта Google Cloud.
# В проекте Google Cloud включите Google Sheets API.
type = "service_account"
project_id = ""
private_key_id = ""
client_email = ""
client_id = ""
# Скопируйте значение private_key вместе с кавычками из JSON: переносы \n сохраняются.
# Либо используйте тройные двойные кавычки для многострочного ключа.
private_key = ""
token_uri = "https://oauth2.googleapis.com/token"
universe_domain = "googleapis.com"

[tracknow]
# false — работать только с видео и таблицей. true — включить партнёрскую интеграцию.
enabled = false
api_key = ""
# ID ВАШЕЙ кампании из Tracknow; 0 означает, что кампания ещё не выбрана.
campaign_id = 0
campaign_title = "cincin_banner_test"
base_url = "https://apiv2.tracknow.io/api/v2"

[polling]
# Период обновления статистики в секундах.
youtube_seconds = 900
tracknow_seconds = 60
